[package]
name = "shinobu"
version = "0.1.0"
authors = ["Aidan Moffat <16ajbm@queensu.ca>"]
edition = "2021"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
fullstack = ["dioxus/fullstack"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0", features = ["router"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
image = "0.25.7"
rand = "0.9.2"
svg = "0.18.0"

[dev-dependencies]
proptest = "1.8.0"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
