[package]
name = "shinobu"
version = "0.1.0"
authors = ["Aidan Moffat <16ajbm@queensu.ca>"]
edition = "2021"

# See more features at https://dioxuslabs.com/learn/0.7/tutorial/new_app#the-cargotoml

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.4", features = ["router"] }
async-std = "1.13.0"
image = "0.25.7"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
svg = "0.18.0"
thiserror = "2.0.17"
dirs = "6.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.22.0", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
js-sys = "0.3.82"
uuid = { version = "1.22.0", features = ["v4", "js"] }
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = ["Window", "Storage", "DomException", "Document", "Element", "HtmlAnchorElement", "Blob", "Url", "Navigator", "Clipboard"] }


[dev-dependencies]
fake = "4.4.0"
proptest = "1.8.0"
# Added for testing & dev purposes (`rust-analyzer`, etc.)
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = ["Window", "Storage", "DomException", "Document", "Element", "HtmlAnchorElement", "Blob", "Url", "Navigator", "Clipboard"] }


[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
lto = "thin"

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
