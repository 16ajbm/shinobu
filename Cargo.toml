[package]
name = "shinobu"
version = "0.1.0"
authors = ["Aidan Moffat <16ajbm@queensu.ca>"]
edition = "2021"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
fullstack = ["dioxus/fullstack"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-std = "1.13.0"
dioxus = { version = "0.6.0", features = ["router"] }
dirs = "6.0.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
image = "0.25.7"
js-sys = "0.3.82"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
svg = "0.18.0"

[dev-dependencies]
proptest = "1.8.0"
serde_json = "1.0.145"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = ["Window", "Storage", "DomException"] }
