[package]
name = "shinobu"
version = "0.1.0"
authors = ["Aidan Moffat <16ajbm@queensu.ca>"]
edition = "2021"

# See more features at https://dioxuslabs.com/learn/0.7/tutorial/new_app#the-cargotoml

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.2", features = ["router"] }
async-std = "1.13.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
image = "0.25.7"
js-sys = "0.3.82"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
svg = "0.18.0"
thiserror = "2.0.17"
wasm-bindgen = "0.2.105"
web-sys = { version = "0.3.82", features = ["Window", "Storage", "DomException", "Document", "Element", "HtmlAnchorElement", "Blob", "Url", "Navigator", "Clipboard"] }

[dev-dependencies]
proptest = "1.8.0"
serde_json = "1.0.145"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
lto = "thin"

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
